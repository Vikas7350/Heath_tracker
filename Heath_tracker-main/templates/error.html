{% extends 'base.html' %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="auth-card text-center">
    <h2 class="fw-bold">Something went wrong</h2>
    <p class="text-muted">{{ message or 'An unexpected error occurred.' }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Return Home</a>
  </div>
</div>
{% endblock %}
