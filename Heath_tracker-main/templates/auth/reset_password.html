{% extends 'base.html' %}
{% block title %}Reset Password - HealthAI{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3"><i class="bi bi-shield-lock"></i></div>
      <h2 class="fw-bold">Create new password</h2>
      <p class="text-muted">Enter the OTP sent to {{ email }}</p>
    </div>
    <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="otp-row mb-3">
        {% for i in range(6) %}
        <input name="otp_digit" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
        {% endfor %}
      </div>
      <label class="form-label fw-semibold">Or enter OTP here</label>
      <input name="otp_code" class="form-control text-center fw-bold mb-3" maxlength="6"
             inputmode="numeric" pattern="[0-9]{6}" placeholder="6-digit OTP">
      <div class="small text-muted text-center mb-3">OTP expires in <span id="otp-countdown">05:00</span></div>
      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" minlength="6" required>
          <button class="btn btn-outline-secondary password-toggle" type="button" title="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
          <input type="password" name="confirm_password" class="form-control" minlength="6" required>
          <button class="btn btn-outline-secondary password-toggle" type="button" title="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Reset Password</button>
    </form>
    <form method="POST" action="{{ url_for('resend_otp') }}" class="mt-3 text-center auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="purpose" value="reset">
      <button class="btn btn-link fw-semibold" type="submit">Resend OTP</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
