{% extends 'base.html' %}
{% block title %}Forgot Password - HealthAI{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3"><i class="bi bi-key"></i></div>
      <h2 class="fw-bold">Reset password</h2>
      <p class="text-muted">We will send a one-time code to your email</p>
    </div>
    <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <label class="form-label fw-semibold">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
      </div>
      <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Send reset OTP</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
