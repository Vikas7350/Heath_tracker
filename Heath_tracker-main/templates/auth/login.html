{% extends 'base.html' %}
{% block title %}Login — HealthAI{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <h2 class="fw-bold">Welcome back</h2>
      <p class="text-muted">Sign in to your HealthAI account</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary password-toggle" type="button" title="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center mb-2">
      <a href="{{ url_for('forgot_password') }}" class="text-primary fw-semibold">Forgot password?</a>
    </p>
    <p class="text-center text-muted mb-0">
      Don't have an account?
      <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Create one free</a>
    </p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
