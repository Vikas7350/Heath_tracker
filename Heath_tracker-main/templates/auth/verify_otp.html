{% extends 'base.html' %}
{% block title %}Verify OTP - HealthAI{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3"><i class="bi bi-envelope-check"></i></div>
      <h2 class="fw-bold">Verify your email</h2>
      <p class="text-muted">Enter the 6-digit OTP sent to {{ email }}</p>
    </div>

    <form method="POST" action="{{ url_for('verify_otp_route') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="otp-row mb-3">
        {% for i in range(6) %}
        <input name="otp_digit" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
        {% endfor %}
      </div>
      <label class="form-label fw-semibold">Or enter OTP here</label>
      <input name="otp_code" class="form-control text-center fw-bold mb-3" maxlength="6"
             inputmode="numeric" pattern="[0-9]{6}" placeholder="6-digit OTP">
      <div class="small text-muted text-center mb-3">OTP expires in <span id="otp-countdown">05:00</span></div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-check2-circle me-2"></i>Verify OTP
      </button>
    </form>

    <form method="POST" action="{{ url_for('resend_otp') }}" class="mt-3 text-center auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="purpose" value="{{ purpose }}">
      <button class="btn btn-link fw-semibold" type="submit">Resend OTP</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
